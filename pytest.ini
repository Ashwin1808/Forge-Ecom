[pytest]
testpaths = services/inventory-service/inventory_service_tests services/order-service/order_service_tests tests
pythonpath = services/inventory-service services/order-service .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    unit: fast tests without external dependencies
    integration: tests that require the local PostgreSQL test database
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning:starlette.*
    ignore:Using `httpx` with `starlette.testclient` is deprecated.*
