name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_ORDERS_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:55433/forge_orders_test
      TEST_INVENTORY_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:55433/forge_inventory_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            services/*/requirements.txt

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Create test databases
        run: |
          python - <<'PY'
          import psycopg

          with psycopg.connect(
              "postgresql://postgres@127.0.0.1:55433/postgres", autocommit=True
          ) as connection:
              for name in ("forge_orders_test", "forge_inventory_test"):
                  exists = connection.execute(
                      "SELECT 1 FROM pg_database WHERE datname = %s", (name,)
                  ).fetchone()
                  if not exists:
                      connection.execute(f'CREATE DATABASE "{name}"')
          PY

      - name: Compile Python sources
        run: python -m compileall -q services tests

      - name: Run backend tests
        run: python -m pytest

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --audit-level=high

  security:
    name: Secrets and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Audit Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit -r requirements-dev.txt

      - name: Scan filesystem for secrets and misconfigurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          skip-dirs: .git,.venv,frontend/node_modules,frontend/dist

  containers:
    name: Container build and scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: forge-order-service:ci
            dockerfile: services/order-service/Dockerfile
          - image: forge-inventory-service:ci
            dockerfile: services/inventory-service/Dockerfile
          - image: forge-commerce-frontend:ci
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ${{ matrix.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan ${{ matrix.image }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
