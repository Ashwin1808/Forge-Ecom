services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forge_postgres_local_dev}
      POSTGRES_DB: postgres
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:-forge_order_local_dev}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:-forge_inventory_local_dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    image: forge-inventory-service:local
    environment:
      DATABASE_URL: postgresql+psycopg://forge_inventory:${INVENTORY_DB_PASSWORD:-forge_inventory_local_dev}@postgres:5432/forge_inventory
      ENVIRONMENT: local
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SEED_ON_START: "true"
      RATE_LIMIT_PER_MINUTE: ${INVENTORY_RATE_LIMIT_PER_MINUTE:-120}
      HOME: /tmp
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 10s

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    image: forge-order-service:local
    environment:
      DATABASE_URL: postgresql+psycopg://forge_order:${ORDER_DB_PASSWORD:-forge_order_local_dev}@postgres:5432/forge_orders
      INVENTORY_BASE_URL: http://inventory-service:8001
      ENVIRONMENT: local
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RATE_LIMIT_PER_MINUTE: ${ORDER_RATE_LIMIT_PER_MINUTE:-120}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      HOME: /tmp
    depends_on:
      postgres:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: forge-commerce-frontend:local
    depends_on:
      order-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  postgres-test:
    profiles: ["test"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:-forge_order_local_dev}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:-forge_inventory_local_dev}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 3s

volumes:
  postgres-data:
  postgres-test-data:
